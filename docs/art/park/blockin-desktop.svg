<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- Composition block-in for the park key art (desktop master, 3:2, the
       landscape size ChatGPT Images produces). Flat colour masses only: a
       layout and value guide for image generation, not artwork. The #labels
       group is the annotated version. Light comes from the upper left,
       behind the camera.

       Screens crop this frame: 16:9 monitors see y 80-944, 16:10 laptops
       see y 32-992, so everything important sits inside y 80-944. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DDB0"/>
      <stop offset="0.55" stop-color="#E4D9BE"/>
      <stop offset="1" stop-color="#B9C8C6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93995A"/>
      <stop offset="1" stop-color="#5E6E3A"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6DE9C" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F6DE9C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#sky)"/>

  <!-- Drawn on the original 2048-wide layout, shifted to this 3:2 frame -->
  <g transform="translate(-256 0)">
    <!-- Far city: hazy, low contrast. Kept low on the left so the text
         zone stays open sky -->
    <g fill="#B7BDB8">
      <path d="M200 440V400h70v40ZM280 440V398l30-14 30 14v42ZM350 440V404h90v36Z"/>
      <path d="M940 440V290h60v150ZM1010 440V260l40-30 30 40v170ZM1280 440V300h80v140ZM1370 440V230h70l10 30v180ZM1460 440V320h90v120Z"/>
    </g>
    <!-- Station clock tower, on the main path's line -->
    <g fill="#A9AFA8">
      <path d="M1104 440V214l26-34 26 34v226Z"/>
      <circle cx="1130" cy="236" r="16" fill="#C9C6B4"/>
    </g>
    <!-- Workshop: sawtooth roof seen through a gap, left of centre -->
    <path d="M640 452l40-46v46l40-46v46l40-46v46l40-46v46l40-46v46H880v20H640Z" fill="#8E8A7A"/>
    <!-- Arcade / greenhouse: glass roof and faded sign, right -->
    <path d="M1480 452l60-56h130l50 56Z" fill="#A7B6B0"/>
    <rect x="1520" y="350" width="150" height="40" fill="#C7A27A"/>
    <!-- Overhead wires sagging between poles -->
    <g stroke="#6B6A60" stroke-width="3" fill="none">
      <path d="M880 300v170M1760 290v180"/>
      <path d="M880 310q440 80 880 -10M880 330q440 80 880 -10"/>
    </g>

    <!-- Back canopy band -->
    <path d="M0 520Q120 420 260 470T520 450Q600 430 640 470L900 470Q960 440 1040 470T1300 462Q1400 430 1480 470T1760 450Q1900 420 2048 470V560H0Z" fill="#5F7445"/>
    <!-- Ground -->
    <path d="M0 540Q700 500 1100 520T2048 540V1024H0Z" fill="url(#ground)"/>

    <!-- Library pavilion, left midground: tiled roof, lit window -->
    <path d="M300 520l80-56h200l80 56Z" fill="#5B5550"/>
    <rect x="336" y="520" width="280" height="116" fill="#B3A68E"/>
    <rect x="390" y="548" width="58" height="48" fill="#F2D38E"/>
    <rect x="504" y="544" width="54" height="92" fill="#6F6455"/>
    <!-- Ginkgo beside it, turning yellow, crown kept below the text zone -->
    <rect x="690" y="480" width="16" height="130" fill="#5A4A3A"/>
    <path d="M620 520q30-104 90-114 80 8 90 114-54 36-90 28-60 8-90-28Z" fill="#C9A548"/>

    <!-- Playground: swing frame and slide, overgrown -->
    <g stroke="#7E5B44" stroke-width="6" fill="none">
      <path d="M720 700l30-110 30 110M840 700l-30-110M750 590h80"/>
      <path d="M800 610v50M820 610v50"/>
    </g>

    <!-- Main path: steps → fountain → light pool and notice board → the
         station's line -->
    <path d="M760 1024Q900 820 960 720L1180 600Q1150 520 1132 470L1150 470Q1190 540 1260 600L1380 720Q1460 840 1560 1024Z" fill="#CFC3A6"/>
    <!-- Side paths: left to the workshop, right to the arcade -->
    <path d="M1140 560Q960 520 780 482l10-10Q980 500 1150 540Z" fill="#C3B79A"/>
    <path d="M1220 560Q1380 520 1520 470l10 8Q1400 540 1240 576Z" fill="#C3B79A"/>

    <!-- Light pool: brightest value in the frame -->
    <ellipse cx="1210" cy="610" rx="260" ry="70" fill="url(#pool)"/>

    <!-- Fountain plaza -->
    <ellipse cx="1150" cy="760" rx="270" ry="70" fill="#A39C8C"/>
    <ellipse cx="1150" cy="752" rx="150" ry="38" fill="#7E8C86"/>
    <path d="M1140 752v-70l10-14 10 14v70Z" fill="#B3AC9C"/>

    <!-- Notice board in the light: the primary interaction -->
    <rect x="1236" y="500" width="10" height="110" fill="#5C4634"/>
    <rect x="1336" y="500" width="10" height="110" fill="#5C4634"/>
    <rect x="1224" y="470" width="134" height="92" fill="#8C6B4B"/>
    <rect x="1236" y="480" width="110" height="72" fill="#E6D9B6"/>
    <path d="M1216 470h150l-14-16h-122Z" fill="#5C4634"/>
    <!-- Fingerpost at the fork -->
    <g fill="#6E5640">
      <rect x="1174" y="500" width="6" height="90"/>
      <path d="M1120 508h56v12h-56l-8-6ZM1180 526h52l8 6-8 6h-52Z"/>
    </g>

    <!-- Old zelkova, right: canopy fills the top-right corner -->
    <path d="M1700 1024V600q0-60-30-120l30-10q50 70 60 130v424Z" fill="#4C3B2E"/>
    <path d="M1350 0H2048V560Q1960 600 1860 560T1660 540Q1560 470 1600 390T1480 260Q1380 200 1420 120T1350 0Z" fill="#3E5A33"/>
    <g fill="#C7C96C" opacity="0.55">
      <circle cx="1560" cy="330" r="30"/><circle cx="1500" cy="210" r="24"/><circle cx="1640" cy="440" r="22"/>
    </g>
    <!-- Dappled shadow on the path -->
    <g fill="#4B5D3C" opacity="0.6">
      <ellipse cx="1320" cy="680" rx="70" ry="14"/><ellipse cx="1420" cy="650" rx="50" ry="10"/><ellipse cx="1260" cy="880" rx="90" ry="18"/>
    </g>

    <!-- Vending machine and phone booth, under the zelkova, light on -->
    <rect x="1490" y="590" width="58" height="150" fill="#B9B3A3"/>
    <rect x="1566" y="520" width="86" height="224" fill="#4F6E57"/>
    <rect x="1579" y="540" width="60" height="146" fill="#E9D79E"/>
    <rect x="1558" y="508" width="102" height="16" fill="#3F5846"/>

    <!-- Bench with a school bag, lower right of the fountain -->
    <g fill="#7A5E45">
      <rect x="1400" y="840" width="160" height="14"/>
      <rect x="1400" y="810" width="160" height="10"/>
      <rect x="1410" y="854" width="8" height="34"/>
      <rect x="1542" y="854" width="8" height="34"/>
      <rect x="1512" y="818" width="34" height="24" fill="#7C8A9C"/>
    </g>

    <!-- Bicycles under kudzu, left -->
    <g stroke="#6A4F3C" stroke-width="5" fill="none">
      <circle cx="480" cy="850" r="44"/><circle cx="600" cy="850" r="44"/>
      <path d="M480 850l50-60h60l10 60M530 790l-10-20"/>
    </g>
    <path d="M420 810q60-70 140-40 70-30 120 40 10 40-20 50H420Z" fill="#56703C" opacity="0.85"/>

    <!-- Stone steps at the camera position -->
    <path d="M700 1024l40-60h860l40 60Z" fill="#A59E8E"/>
    <path d="M760 964l30-40h760l30 40Z" fill="#B3AC9C"/>

    <!-- Foreground, darkest values: susuki and goldenrod bottom-left, shrub
         bottom-right, near leaves top-right -->
    <path d="M256 1024V900q50-40 100-14 40-40 80 0 30 40 20 138Z" fill="#3A4A2C"/>
    <g stroke="#D4BE7E" stroke-width="5" fill="none">
      <path d="M300 1024q10-130 50-210M350 1024q0-150 30-240M420 1024q20-110 70-190"/>
    </g>
    <path d="M1792 1024V800q-60-40-110 0-50-10-70 60-20 70 0 164Z" fill="#33442A"/>
    <path d="M1600 0h192v190q-50 36-100 10-60 36-110-20-40 8-70-80Z" fill="#2E4226"/>
  </g>

  <g id="labels" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1E2A1E">
    <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#B07A12"/></marker></defs>
    <!-- Screen crops -->
    <rect x="1.5" y="80" width="1533" height="864" fill="none" stroke="#9A3D2A" stroke-width="3" stroke-dasharray="16 10"/>
    <text x="12" y="934" fill="#9A3D2A">16:9 crop (y 80–944): everything important inside</text>
    <rect x="1.5" y="32" width="1533" height="960" fill="none" stroke="#2A4F9A" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="12" y="984" fill="#2A4F9A">16:10 crop (y 32–992)</text>
    <!-- Text zone -->
    <rect x="60" y="140" width="520" height="250" fill="none" stroke="#1E2A1E" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="74" y="170">TEXT ZONE: name + intro (quiet sky only)</text>
    <!-- Horizon and vanishing point -->
    <path d="M0 430H1536" stroke="#9A3D2A" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="1350" y="424" font-size="16" fill="#9A3D2A">horizon</text>
    <circle cx="884" cy="430" r="7" fill="#9A3D2A"/>
    <text x="896" y="426" font-size="16" fill="#9A3D2A">VP</text>
    <!-- Key light -->
    <path d="M20 100l70 50" stroke="#B07A12" stroke-width="5" marker-end="url(#a)"/>
    <text x="20" y="60" fill="#B07A12">key light: low sun, upper left, behind camera</text>
    <g font-size="18">
      <text x="800" y="166">① station clock tower</text>
      <text x="380" y="398">② workshop roof</text>
      <text x="1170" y="340">③ arcade sign</text>
      <text x="80" y="672">④ pavilion, lit window</text>
      <text x="990" y="446">⑤ notice board</text>
      <text x="1320" y="512">⑥ phone booth</text>
      <text x="1220" y="580">vending</text>
      <text x="770" y="640">brightest: light pool</text>
      <text x="1140" y="912">bench + school bag</text>
      <text x="170" y="920">bicycles under kudzu</text>
      <text x="470" y="724">playground</text>
      <text x="820" y="852">dry mossy fountain</text>
      <text x="610" y="1010">stone steps (camera)</text>
      <text x="840" y="520">fingerpost</text>
    </g>
  </g>
</svg>
